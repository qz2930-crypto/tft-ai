# Project configuration (non-secret). Secrets live in .env.
# 项目配置（非敏感）。密钥放在 .env。

set:
  id: 18                      # Current set / 当前赛季
  name: "Enchanted Wilds"
  name_zh: "魔法荒野"
  patch: "18.6"               # Target patch for collection / 目标采集版本
  # NOTE: match-v1 `game_version` is a placeholder ("TFT Unreal Version ?.?.?.?") in the
  # Unreal era, so patch is inferred from `tft_set_number` + `game_datetime` against
  # this calendar (UTC). Add a row when a new patch ships.
  # 注意：虚幻版 game_version 为占位符，版本由 tft_set_number + 对局时间 对照下表推断（UTC）。
  patches:                    # verified against official schedule (US Pacific deploy ≈ 18:00 UTC)
    - { tag: "18.1", start: "2026-08-26T18:00:00Z" }
    - { tag: "18.2", start: "2026-09-10T18:00:00Z" }
    - { tag: "18.3", start: "2026-09-23T18:00:00Z" }
    - { tag: "18.4", start: "2026-10-07T18:00:00Z" }
    - { tag: "18.5", start: "2026-10-21T18:00:00Z" }
    - { tag: "18.6", start: "2026-11-04T18:00:00Z" }   # 18.6B (2026-11-11) is a B-patch, same tag
    # - { tag: "19.1", start: "2026-12-01T18:00:00Z" }  # Set 19 — enable when set.id becomes 19

ingest:
  tiers: ["CHALLENGER", "GRANDMASTER"]   # 决策⑦：宗师 + 王者
  queue: "RANKED_TFT"
  queue_id: 1100
  matches_per_player: 40      # match ids to fetch per player / 每位玩家拉取的对局数
  since_patch: "18.6"         # only collect ids newer than this patch start (null = all) / 只收该版本之后的对局
  target_matches: 30000       # Per-patch target / 每版本目标局数
  rate_limit:                 # Dev key defaults / 开发 key 默认限速
    per_second: 20
    per_two_minutes: 100

static:
  cdragon_base: "https://raw.communitydragon.org"
  cdragon_branch: "latest"    # or "pbe"
  languages: ["en_us", "zh_cn"]

rounds:
  # last_round → "stage-round" label. Stage 1 has `stage1_rounds` rounds; every later stage
  # has `rounds_per_stage` (6 fights + carousel + PvE). Verify when a set changes structure.
  # 回合号 → 阶段标签映射；赛季结构变化时需核对。
  stage1_rounds: 4
  rounds_per_stage: 7

analysis:
  # M6 metrics defaults — see docs/03-metrics.md / 指标默认值，见 docs/03-metrics.md
  shrinkage_k: 30
  min_n_display: 50
  min_n_reliable: 200
  placement_sigma_default: 2.29
  level_buckets: [[1, 7], [8, 8], [9, 10]]
  stage_buckets: ["2", "3", "4", "5", "6+"]
  rank_weight: false          # 决策④：段位加权默认关闭

paths:
  raw: "data/raw"
  processed: "data/processed"
  results: "data/results"
  static: "data/static"
